apiVersion: v1
kind: Service
metadata:
  name: {{ include "tasklane.api.fullname" . }}
  labels:
    {{- include "tasklane.api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "tasklane.api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tasklane.worker.fullname" . }}-metrics
  labels:
    {{- include "tasklane.worker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "tasklane.worker.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.worker.metricsPort }}
      targetPort: metrics
{{- if .Values.postgresql.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tasklane.postgres.fullname" . }}
  labels:
    {{- include "tasklane.postgres.labels" . | nindent 4 }}
spec:
  # Headless: stable DNS for the StatefulSet pod.
  clusterIP: None
  selector:
    {{- include "tasklane.postgres.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
