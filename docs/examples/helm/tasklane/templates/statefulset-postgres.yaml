{{- if .Values.postgresql.enabled }}
# Lab-grade PostgreSQL. No replication, no backups, no failover.
# Production: postgresql.enabled=false and database.host=<managed endpoint>.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "tasklane.postgres.fullname" . }}
  labels:
    {{- include "tasklane.postgres.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "tasklane.postgres.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "tasklane.postgres.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tasklane.postgres.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The image starts as root and drops to UID 999 unless it is started
        # as 999 directly, which is what the restricted profile requires.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ include "tasklane.image" .Values.postgresql.image | quote }}
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.database.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_PASSWORD_FILE
              value: /etc/tasklane/db/password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: db-secret
              mountPath: /etc/tasklane/db
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.database.user | quote }}, "-d", {{ .Values.database.name | quote }}, "-h", "127.0.0.1"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.database.user | quote }}, "-d", {{ .Values.database.name | quote }}, "-h", "127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          securityContext:
            {{- include "tasklane.containerSecurityContext" . | nindent 12 }}
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- include "tasklane.dbSecretVolume" . | nindent 8 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgresql.storage.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storage.size | quote }}
{{- end }}
