# ALTERNATIVE: when a job truly needs some Docker API access, put a filtering
# proxy in front of the socket instead of exposing the socket itself.
#
# ghcr.io/tecnativa/docker-socket-proxy is an HAProxy in front of the socket.
# Every capability is an env var; unset ones default to 0 (denied). By default
# it also denies POST (create/start/exec), so it is read-only unless you opt
# in. Verified 2026-09-21: the Tecnativa/docker-socket-proxy repo is active and
# not archived; ghcr.io is the registry the project now recommends.
name: socket-escape-proxy

services:
  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    environment:
      # Minimal read-only allow-list. Everything not listed stays denied.
      CONTAINERS: "1"
      IMAGES: "1"
      INFO: "1"
      POST: "0"          # deny all mutating calls: no run, start, exec, build
    volumes:
      # The proxy holds the socket read-only; the job never sees it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /run:rw,noexec,nosuid,size=8m
    networks: [proxy]

  ci-runner:
    image: docker:cli
    command: ["sleep", "infinity"]
    environment:
      # Talk to the proxy over TCP, not the raw socket.
      DOCKER_HOST: tcp://dockerproxy:2375
    depends_on: [dockerproxy]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks: [proxy]

networks:
  proxy:
    internal: true
