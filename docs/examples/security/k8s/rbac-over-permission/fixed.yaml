# HARDENED. The same application, granted only what it actually needs: read
# access to two named ConfigMaps in its own namespace, and nothing else.
# A namespaced Role + RoleBinding cannot reach other namespaces, cannot read
# Secrets, and grants none of the dangerous verbs (escalate, bind, impersonate).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  namespace: rbac-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-config-reader
  namespace: rbac-demo
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["app-config", "feature-flags"]  # only these two
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-config-reader
  namespace: rbac-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-config-reader
subjects:
  - kind: ServiceAccount
    name: app
    namespace: rbac-demo
