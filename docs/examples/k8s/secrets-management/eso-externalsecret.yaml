# External Secrets Operator (ESO). Requires the operator installed
# (external-secrets.io CRDs and controller, ESO v2.x).
#
# ESO keeps the source of truth OUT of the cluster (a cloud secret manager,
# Vault, or another Kubernetes cluster) and syncs it into a native Secret. The
# manifests in Git reference the secret by name; the value never appears in Git.
#
# This example uses the "kubernetes" provider (read a Secret from another
# namespace/cluster), which needs no cloud account and is handy for the lab.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cluster-store
  namespace: tasklane
spec:
  provider:
    kubernetes:
      remoteNamespace: secrets-source
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tasklane-db
  namespace: tasklane
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-store
    kind: SecretStore
  # ESO creates and owns this Secret; you never write the value into Git.
  target:
    name: tasklane-db
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: tasklane-db
        property: password
