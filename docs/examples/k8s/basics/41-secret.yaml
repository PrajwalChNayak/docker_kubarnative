# A Secret is a ConfigMap with different defaults and different handling:
# it is stored base64-encoded (encoding, NOT encryption), it can be encrypted
# at rest in etcd, and RBAC on secrets is normally much tighter.
#
# Checking a real credential into git is exactly the mistake this handbook
# warns about. The value below is a throwaway lab string. Real secrets come
# from a manager (External Secrets Operator, Sealed Secrets, a cloud KMS) or
# from "kubectl create secret" outside version control.
apiVersion: v1
kind: Secret
metadata:
  name: hello-secret
  namespace: tasklane-basics
  labels:
    app.kubernetes.io/name: hello-secret
    app.kubernetes.io/part-of: tasklane
type: Opaque
# stringData takes plain text and the API server encodes it into data.
# Reading the object back shows base64 under "data".
stringData:
  api-token: not-a-real-token-abc123
