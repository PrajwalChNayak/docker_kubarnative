# Production never keeps the database password in git. External Secrets
# Operator (v2.11.0, API external-secrets.io/v1) reads it from the external
# store named by the ClusterSecretStore and writes the Secret tasklane-db that
# every pod mounts. creationPolicy: Owner means ESO owns the Secret and
# deletes it when this ExternalSecret goes away.
#
# The ClusterSecretStore itself is cluster infrastructure, not part of this
# overlay; see k8s-security/secrets-management.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tasklane-db
  labels:
    app.kubernetes.io/component: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: tasklane-prod
    kind: ClusterSecretStore
  target:
    name: tasklane-db
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: tasklane/prod/postgres
        property: password
