# Build the handbook and publish it to GitHub Pages.
#
# One-time setup: repository Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". No secrets or extra configuration are needed;
# the generator has no npm dependencies.
name: Publish handbook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate content
        run: node scripts/check.mjs
      - name: Build site
        run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
