apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - hpa.yaml

# Once an HPA owns the replica count, the Deployment must not carry one: a
# re-apply of spec.replicas fights the autoscaler. A JSON 6902 "remove" op
# deletes the field entirely, which strategic merge cannot express.
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: tasklane-api
    patch: |-
      - op: remove
        path: /spec/replicas
