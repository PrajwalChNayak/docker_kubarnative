# Production API: no migration on pod start, spread across zones, bigger
# requests.
#
# `$patch: delete` removes one element of a merge-keyed list — here the
# `migrate` initContainer. In production the schema migration runs once, as a
# gated pipeline step, not on every pod that starts during a rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasklane-api
spec:
  template:
    spec:
      initContainers:
        - name: migrate
          $patch: delete
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tasklane-api
      containers:
        - name: api
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              memory: 256Mi
