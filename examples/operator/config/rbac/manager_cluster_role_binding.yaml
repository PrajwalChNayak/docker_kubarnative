apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tasklane-operator-manager
  labels:
    app.kubernetes.io/name: tasklane-operator
    app.kubernetes.io/part-of: tasklane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tasklane-operator-manager
subjects:
  - kind: ServiceAccount
    name: tasklane-operator
    namespace: tasklane-system
