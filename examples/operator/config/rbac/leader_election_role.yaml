# Leader election is the only thing the operator writes in its own namespace.
# controller-runtime's LeaseLock does Get, Create and Update on one Lease named
# after --leader-election-id, so those are the only verbs granted. This is a
# namespaced Role, not a ClusterRole: the operator cannot touch Leases anywhere
# else, including the kube-node-lease namespace where node heartbeats live.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tasklane-operator-leader-election
  namespace: tasklane-system
  labels:
    app.kubernetes.io/name: tasklane-operator
    app.kubernetes.io/part-of: tasklane
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tasklane-operator-leader-election
  namespace: tasklane-system
  labels:
    app.kubernetes.io/name: tasklane-operator
    app.kubernetes.io/part-of: tasklane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tasklane-operator-leader-election
subjects:
  - kind: ServiceAccount
    name: tasklane-operator
    namespace: tasklane-system
