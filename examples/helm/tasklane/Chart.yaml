# Chart API v2 is what Helm 4 installs by default. Chart API v3 exists but is
# experimental and only parsed when HELM_EXPERIMENTAL_CHART_V3=1 is set, so
# every chart meant to be consumed by other people stays on v2.
apiVersion: v2
name: tasklane
description: The Tasklane API, worker and optional PostgreSQL, as one release
type: application
# version is the chart's own version and must be bumped on every chart change.
version: 0.1.0
# appVersion is the version of the software the chart deploys. It is metadata:
# nothing uses it unless a template does.
appVersion: "0.1.0"
kubeVersion: ">=1.34.0-0"
home: https://example.com/tasklane
sources:
  - https://example.com/tasklane
keywords:
  - tasklane
  - example
maintainers:
  - name: Tasklane handbook
    url: https://example.com/tasklane
