{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "tasklane.api.fullname" . }}
  labels:
    {{- include "tasklane.api.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ required "httpRoute.parentRef.name is required when httpRoute.enabled" .Values.httpRoute.parentRef.name }}
      {{- with .Values.httpRoute.parentRef.namespace }}
      # Cross-namespace: the Gateway listener must allow routes from this
      # release's namespace (allowedRoutes.namespaces.from Selector or All).
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.httpRoute.parentRef.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httpRoute.pathPrefix | quote }}
      backendRefs:
        - name: {{ include "tasklane.api.fullname" . }}
          port: {{ .Values.api.service.port }}
{{- end }}
