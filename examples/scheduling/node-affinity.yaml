# Node selection demo: nodeSelector plus required and preferred node affinity.
#
# The lab labels its two workers topology.kubernetes.io/zone=zone-a and
# zone-b, so the required rule matches both workers and the preferred rule
# pulls replicas towards zone-a.
#
# Throwaway workload: pinned busybox running sleep as UID 65534 so that it
# passes the "restricted" Pod Security Standard enforced on the namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sched-node-affinity
  namespace: tasklane
  labels:
    app.kubernetes.io/name: sched-node-affinity
    app.kubernetes.io/component: demo
    app.kubernetes.io/part-of: tasklane
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: sched-node-affinity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sched-node-affinity
        app.kubernetes.io/component: demo
        app.kubernetes.io/part-of: tasklane
    spec:
      automountServiceAccountToken: false
      # nodeSelector and nodeAffinity are ANDed: a node must satisfy both.
      nodeSelector:
        kubernetes.io/os: linux
      affinity:
        nodeAffinity:
          # Hard rule. Terms are ORed, matchExpressions inside a term are ANDed.
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: ["zone-a", "zone-b"]
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
          # Soft rules. Weights (1-100) are summed per node and added to the
          # node's score; they never make a node infeasible.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: ["zone-a"]
            - weight: 20
              preference:
                matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["amd64", "arm64"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sleep
          image: busybox:1.37-musl@sha256:fc6dddc4c44b1bfe37f41cae8e67d1693828e8f42a91862816d7953e2c9d3f23
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
