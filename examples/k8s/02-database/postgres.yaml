# Stage 2: PostgreSQL as a single-replica StatefulSet.
# This is a learning setup. For production, use a managed database or a
# PostgreSQL operator (CloudNativePG and similar) that handles replication,
# failover and backups. See the "Stateful workloads" page.
#
# Requires the Secret created in the README:
#   kubectl -n tasklane create secret generic tasklane-db --from-literal=password=...
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: tasklane
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: tasklane
spec:
  # Headless: gives the StatefulSet pod a stable DNS name,
  # postgres-0.postgres.tasklane.svc.cluster.local, and "postgres" resolves
  # straight to the pod IP.
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: tasklane
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: tasklane
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: tasklane
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The official image normally starts as root and drops to the
        # "postgres" user (UID 999). Starting directly as 999 satisfies the
        # restricted Pod Security profile; the entrypoint supports this.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18-trixie@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: tasklane
            - name: POSTGRES_DB
              value: tasklane
            - name: POSTGRES_PASSWORD_FILE
              value: /etc/tasklane/db/password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: db-secret
              mountPath: /etc/tasklane/db
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "tasklane", "-d", "tasklane", "-h", "127.0.0.1"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "tasklane", "-d", "tasklane", "-h", "127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: db-secret
          secret:
            secretName: tasklane-db
            items:
              - key: password
                path: password
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
