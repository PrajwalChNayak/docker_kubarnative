# Sealed Secrets. Requires the controller installed (github.com/bitnami/
# sealed-secrets, v0.40.0) and its cluster key.
#
# A SealedSecret is safe to commit to Git: the value is encrypted with the
# controller's public key and can only be decrypted by the controller running
# in the cluster. The controller watches SealedSecrets and generates the
# matching native Secret in the same namespace.
#
# You do NOT hand-write encryptedData. Produce it with kubeseal, e.g.:
#   kubectl -n tasklane create secret generic tasklane-db \
#     --from-literal=password=REDACTED --dry-run=client -o yaml \
#     | kubeseal --controller-namespace kube-system -o yaml > sealed-secret.yaml
# The ciphertext below is an illustrative placeholder, not a real sealed value.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: tasklane-db
  namespace: tasklane
spec:
  encryptedData:
    password: AgBQLACEHOLDERciphertextThisIsNotARealSealedValueReplaceWithKubeseal==
  template:
    metadata:
      name: tasklane-db
      namespace: tasklane
    type: Opaque
