# EncryptionConfiguration — kube-apiserver config, NOT a cluster resource.
#
# You never `kubectl apply` this. It is a file on the control-plane node,
# passed to the apiserver with --encryption-provider-config, that tells the
# apiserver how to encrypt resources (here: Secrets) before writing them to
# etcd. Without it, Secrets sit in etcd only base64-encoded — anyone who can
# read an etcd backup can read every Secret.
#
# Providers are tried in order for WRITES the first provider is used; for READS
# every provider is tried until one decrypts. Keep `identity` LAST so existing
# plaintext can still be read while you migrate, then remove it and run a
# Storage Version Migration (GA in 1.37) to rewrite everything encrypted.
apiVersion: apiserver.config.k8s.io/v1
kind: EncryptionConfiguration
resources:
  - resources:
      - secrets
    providers:
      # KMS v2: the apiserver holds only a short-lived, KEK-wrapped DEK and
      # calls an external KMS plugin to unwrap it. Key rotation happens in the
      # KMS; the apiserver picks up a new key hash automatically. v2 caches DEKs
      # and is far less chatty than v1. Recommended for production.
      - kms:
          apiVersion: v2
          name: tasklane-kms
          endpoint: unix:///var/run/kmsplugin/socket.sock
          timeout: 3s
      # Fallback local provider so the cluster still works without a KMS in the
      # lab. secretbox uses a 32-byte key kept in THIS file, so the file itself
      # must be tightly protected (root-only, off backups). aescbc is discouraged.
      - secretbox:
          keys:
            - name: key1
              secret: c2VjcmV0Ym94LTMyLWJ5dGUta2V5LXBsYWNlaG9sZGVyMDA=
      # identity = no encryption. Last, so old plaintext Secrets stay readable
      # during migration. Remove it once everything is re-encrypted.
      - identity: {}
