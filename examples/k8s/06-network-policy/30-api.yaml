# Stage 6, step 4: the API's ingress and egress.
#
# Ingress comes from two places only:
#   - the Envoy Gateway data plane in namespace envoy-gateway-system. The pods
#     Envoy Gateway creates carry app.kubernetes.io/name=envoy. Selecting the
#     namespace alone would also allow the controller pod.
#   - Prometheus in namespace monitoring, scraping /metrics on the same port.
#
# Both peers are outside this namespace, so a namespaceSelector is required: a
# bare podSelector only ever matches pods in the policy's own namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
  namespace: tasklane
  labels:
    app.kubernetes.io/part-of: tasklane
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
---
# Egress: the database, and nothing else. DNS is granted separately.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-egress-postgres
  namespace: tasklane
  labels:
    app.kubernetes.io/part-of: tasklane
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: database
      ports:
        - protocol: TCP
          port: 5432
