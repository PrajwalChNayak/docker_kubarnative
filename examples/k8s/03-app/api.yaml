# Stage 3: the Tasklane API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tasklane-api
  namespace: tasklane
  labels:
    app.kubernetes.io/name: tasklane-api
    app.kubernetes.io/part-of: tasklane
# The API never talks to the Kubernetes API, so it gets no token at all.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasklane-api
  namespace: tasklane
  labels:
    app.kubernetes.io/name: tasklane-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: tasklane
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: tasklane-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0     # never drop below the desired count during a rollout
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tasklane-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: tasklane
    spec:
      serviceAccountName: tasklane-api
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across the two lab zones, then across nodes.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tasklane-api
      initContainers:
        # Idempotent schema migration. The Deployment's pods only start once
        # it exits 0. Concurrent runs are safe (CREATE ... IF NOT EXISTS).
        - name: migrate
          image: tasklane-api:0.1.0
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: tasklane-config
          volumeMounts:
            - name: db-secret
              mountPath: /etc/tasklane/db
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: tasklane-api:0.1.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: tasklane-config
          volumeMounts:
            - name: db-secret
              mountPath: /etc/tasklane/db
              readOnly: true
          # startupProbe holds off the other probes until the process is up.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          # Liveness checks only the process, never the database.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness checks the database; failing removes the pod from the
          # Service's EndpointSlices instead of restarting it.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: db-secret
          secret:
            secretName: tasklane-db
            items:
              - key: password
                path: password
---
apiVersion: v1
kind: Service
metadata:
  name: tasklane-api
  namespace: tasklane
  labels:
    app.kubernetes.io/name: tasklane-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: tasklane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tasklane-api
  ports:
    - name: http
      port: 80
      targetPort: http
