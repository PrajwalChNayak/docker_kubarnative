# kind cluster for every lab in the handbook.
#   kind create cluster --config examples/lab/kind-config.yaml
#
# The node image is pinned by digest so every reader gets the same
# Kubernetes 1.37.0 build that the manifests were validated against.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: tasklane
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      ingress-ready: "true"
    extraPortMappings:
      # Gateway (Envoy Gateway data plane, exposed as NodePorts 30080/30443)
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 127.0.0.1
      - containerPort: 30443
        hostPort: 8443
        listenAddress: 127.0.0.1
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      topology.kubernetes.io/zone: zone-a
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      topology.kubernetes.io/zone: zone-b
